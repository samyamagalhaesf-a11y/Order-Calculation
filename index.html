<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Calculation for Hot Case Products</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #FFD194, #D6A4A4);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        width: 400px;
        text-align: center;
    }
    h1 {
        margin-bottom: 25px;
        color: #333;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: 500;
        text-align: left;
    }
    input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
        margin-top: 5px;
        box-sizing: border-box;
    }
    input:focus {
        border-color: #FF7F50;
        outline: none;
    }
    button {
        margin-top: 25px;
        padding: 12px;
        width: 100%;
        background-color: #FF7F50;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    button:hover {
        background-color: #e36b3d;
    }
    #result {
        margin-top: 25px;
        font-size: 18px;
        font-weight: 700;
        color: #333;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Order Calculation for Hot Case Products</h1>

    <label for="avgConsumption">Enter the product’s average daily consumption (Boxes per Day)</label>
    <input type="number" id="avgConsumption" placeholder="Ex: 10">

    <label for="openingStock">Enter Opening Stock (Boxes)</label>
    <input type="number" id="openingStock" placeholder="Ex: 20">

    <label for="safetyMargin">Enter Safety Margin Days (Day(s))</label>
    <input type="number" id="safetyMargin" placeholder="Ex: 2">

    <button onclick="calculateOrder()">Calculate Order</button>

    <div id="result"></div>
</div>

<script>
function calculateOrder() {
    const avgConsumption = parseFloat(document.getElementById('avgConsumption').value);
    const openingStock = parseFloat(document.getElementById('openingStock').value);
    const safetyMargin = parseFloat(document.getElementById('safetyMargin').value);

    if (isNaN(avgConsumption) || isNaN(openingStock) || isNaN(safetyMargin)) {
        alert("Please fill in all fields with valid numbers.");
        return;
    }

    // Fórmula exata que você passou
    const order = (7 * avgConsumption) + (safetyMargin * avgConsumption) - openingStock;

    document.getElementById('result').innerText = "Order Quantity: " + Math.max(0, order.toFixed(2)) + " Boxes";
}
</script>

</body>
</html>
